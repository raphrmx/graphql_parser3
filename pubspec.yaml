name: graphql_parser3
version: 3.2.1
description: >-
  Parses GraphQL queries and schemas into an AST whose every node carries a
  source span. The lexer and the recursive-descent parser behind graphql_server3.
homepage: https://github.com/raphrmx/graphql_parser3
repository: https://github.com/raphrmx/graphql_parser3
issue_tracker: https://github.com/raphrmx/graphql_parser3/issues

topics:
  - graphql
  - parser
  - ast

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  source_span: ^1.10.2
  string_scanner: ^1.4.1

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.0
